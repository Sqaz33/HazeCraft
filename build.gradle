plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}
version = project.mod_version
group = 'dev.local.haze'
repositories { mavenCentral() }
loom {
    splitEnvironmentSourceSets()
    mods {
        haze {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        client {
            if (project.hasProperty('lab')) {
                vmArg '-Dhaze.lab=true'
                vmArg '-Dfabric.client.gametest=true'
                vmArg '-Dfabric.client.gametest.modid=haze'
                vmArg '-Xmx3G'
                programArg '--width=1280'
                programArg '--height=720'
            }
        }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    include "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 21 }
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
